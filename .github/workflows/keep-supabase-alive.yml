name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:00 AM PKT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Mock Request to Supabase
        run: |
          echo "Sending daily ping request to Supabase to keep project active..."

          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://bslksbjdxdffacaoutaz.supabase.co"
          fi

          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzbGtzYmpkeGRmZmFjYW91dGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODEzOTcsImV4cCI6MjEwMzA1NzM5N30.rXupFUrAHP0v8AriI6UoVKalHxvmDXEemLaUptUlAjA"
          fi

          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase Response Status Code: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 400 ]; then
            echo "Successfully pinged Supabase! Database project remains active."
          else
            echo "Error: Failed to query Supabase REST API (Status Code: $RESPONSE_CODE)"
            exit 1
          fi
