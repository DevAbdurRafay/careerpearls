{# Favicon - Browser Tab Icon #}
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">

{# Open Graph (OG) Meta Tags - WhatsApp, Facebook, Telegram, LinkedIn link preview #}
<meta property="og:type" content="website">
<meta property="og:site_name" content="CareerPearls">
<meta property="og:title" content="CareerPearls — Find Your Dream Career">
<meta property="og:description" content="CareerPearls connects top employers with talented candidates. Apply to jobs, analyze your resume with AI, and grow your career.">
<meta property="og:image" content="{{ request.host_url.rstrip('/') }}{{ url_for('static', filename='images/logo.png') }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ request.url }}">

{# Twitter Card Meta Tags #}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CareerPearls — Find Your Dream Career">
<meta name="twitter:description" content="CareerPearls connects top employers with talented candidates. Apply to jobs, analyze your resume with AI, and grow your career.">
<meta name="twitter:image" content="{{ request.host_url.rstrip('/') }}{{ url_for('static', filename='images/logo.png') }}">
